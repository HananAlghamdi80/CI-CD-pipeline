name: CI Pipeline

on:
  push:
    branches: [ "dev" ]    # يشتغل عند أي push لفرع dev

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      # 1) جلب الكود
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) إعداد Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3) تثبيت التبعيات وتشغيل الاختبارات
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # 4) تسجيل الدخول لـ DockerHub
      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5) بناء الصورة
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/node-azure-demo:${{ github.sha }} .

      # 6) دفع الصورة للـ DockerHub
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/node-azure-demo:${{ github.sha }}

      # 7) رفع artifacts (اختياري)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: node-build
          path: .
