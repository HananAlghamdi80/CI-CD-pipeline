name: CI Pipeline

on:
  push:
    branches:
      - dev            # يشتغل عند أي push إلى فرع dev

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      # 1) جلب الكود
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) إعداد Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3) تثبيت التبعيات
      - name: Install dependencies
        run: npm ci

      # 4) تسجيل الدخول لـ DockerHub
      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5) بناء ودفع الصورة
      - name: Build & Push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/node-azure-demo:${{ github.sha }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/node-azure-demo:${{ github.sha }} \
                     ${{ secrets.DOCKER_USERNAME }}/node-azure-demo:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/node-azure-demo:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/node-azure-demo:latest
